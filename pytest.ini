# `.` lets tests import `tools.convert` (the converter package); tools/dev lets them import
# reference.py without package hacks; tests/smoke and tests/convert are on the path so tests
# can import their small helper modules (_assets, _tiny).
[pytest]
pythonpath = . tools/dev tests/smoke tests/convert
testpaths = tests/dev tests/engine tests/convert tests/smoke
markers =
    engine_run: runs the built llama.cpp engine on tiny converted models, per model family (skipped when absent)
    smoke: end-to-end checks that need the engine build and cached model assets (skipped when absent)
